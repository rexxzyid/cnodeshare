{% extends "base.html" %}
{% block title %}Password diperlukan — CodeShare{% endblock %}
{% block content %}
<div class="shell auth-shell">
  <div class="card form-card">
    <div class="feature-icon">🔒</div><h1 class="page-title">Paste terkunci</h1><p class="muted">Masukkan password untuk membuka paste ini.</p>
    {% if error %}<div class="notice notice-error" style="margin-top:18px">{{ error }}</div>{% endif %}
    <form method="get" style="margin-top:22px"><div class="field"><label class="label">Password</label><input class="input" name="password" type="password" autofocus required></div><button class="btn btn-primary btn-block">Buka paste</button></form>
  </div>
</div>
{% endblock %}
