{% extends "base.html" %}
{% block title %}Password diperlukan — CodeShare{% endblock %}
{% block content %}
<div class="shell auth-shell">
  <div class="card form-card">
    <div class="feature-icon"><svg class="icon icon-lg"><use href="#i-lock"></use></svg></div>
    <h1 class="page-title">Paste terkunci</h1>
    <p class="muted">Masukkan password untuk membuka paste ini.</p>
    {% if error %}<div class="notice notice-error" style="margin-top:20px">{{ error }}</div>{% endif %}
    <form method="get" style="margin-top:24px">
      <div class="field"><label class="label" for="password">Password</label><input class="input" id="password" name="password" type="password" autofocus required></div>
      <button class="btn btn-primary btn-block" type="submit">Buka paste</button>
    </form>
  </div>
</div>
{% endblock %}
