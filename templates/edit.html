{% extends "base.html" %}
{% block title %}Edit Paste — CodeShare{% endblock %}
{% block content %}
<div class="shell form-shell">
  <div class="page-head"><div><div class="page-kicker">Edit</div><h1 class="page-title">Perbarui paste</h1></div></div>
  <form id="edit-form" class="card form-card" data-paste-id="{{ paste_id }}">
    <div id="loading" class="notice">Memuat paste...</div>
    <div id="fields" hidden>
      <div class="field"><label class="label">Judul</label><input class="input" name="title" maxlength="160" required></div>
      <div class="field"><label class="label">Bahasa</label><select class="select" name="language"><option value="text">Plain text</option><option value="javascript">JavaScript</option><option value="typescript">TypeScript</option><option value="python">Python</option><option value="go">Go</option><option value="html">HTML</option><option value="css">CSS</option><option value="json">JSON</option><option value="bash">Bash</option><option value="sql">SQL</option><option value="markdown">Markdown</option></select></div>
      <div class="field"><label class="label">Isi</label><textarea class="textarea" name="content" spellcheck="false" required></textarea></div>
      <div class="form-row"><label class="checkbox"><input type="checkbox" name="is_private"> Private paste</label><label class="checkbox"><input type="checkbox" name="remove_password"> Hapus password lama</label></div>
      <div class="field"><label class="label">Password baru</label><input class="input" name="password" type="password" placeholder="Kosongkan untuk mempertahankan password lama"><span class="help" id="password-hint"></span></div>
      <div class="form-actions"><a class="btn" id="cancel-link" href="/dashboard">Batal</a><button class="btn btn-primary" type="submit">Simpan perubahan</button></div>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!CodeShare.auth.token()) return location.href = '/login'
  const form = document.getElementById('edit-form'); const id = form.dataset.pasteId
  try {
    const paste = await api(`/api/paste/${encodeURIComponent(id)}/edit`)
    form.elements.title.value = paste.title; form.elements.content.value = paste.content; form.elements.language.value = paste.language; form.elements.is_private.checked = paste.is_private
    document.getElementById('password-hint').textContent = paste.has_password ? 'Paste ini memiliki password.' : 'Paste ini tidak memiliki password.'
    document.getElementById('cancel-link').href = `/paste/${encodeURIComponent(id)}`
    document.getElementById('loading').hidden = true; document.getElementById('fields').hidden = false
  } catch (error) { document.getElementById('loading').className = 'notice notice-error'; document.getElementById('loading').textContent = error.message }
  form.addEventListener('submit', async e => {
    e.preventDefault(); const button = e.submitter; button.disabled = true
    try { await api(`/api/paste/${encodeURIComponent(id)}`, { method: 'PUT', body: new FormData(form) }); location.href = `/paste/${encodeURIComponent(id)}` }
    catch (error) { toast(error.message, 'error'); button.disabled = false }
  })
})
</script>
{% endblock %}
